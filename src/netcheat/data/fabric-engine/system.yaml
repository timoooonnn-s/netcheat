    mode: User EXEC
    tags: [management, mgmt, oob, clip, ip]
    example: |
      show mgmt interface
      show mgmt ip route
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_mgmt_interface.shtml

  - cmd: show sys mtu
    desc: The system-wide MTU (jumbo frames).
    kind: show
    mode: User EXEC
    tags: [mtu, jumbo, frame size]
    notes: >
      The default is 1950 bytes, which already covers the 22 bytes of SPB MAC-in-MAC overhead for standard
      1500-byte frames. Set jumbo frames with `sys mtu <size>` (the range depends on the platform, see `sys mtu ?`)
      and keep the value the same on every switch in the fabric.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_sys_mtu.shtml

  - cmd: monitor ports statistics <ports> interface utilization
    desc: Live-updating port utilization (refreshes until you stop it).
    kind: show
    mode: Privileged EXEC
    tags: [utilization, bandwidth, traffic, live, monitor, load]
    example: monitor ports statistics 1/1-1/4 interface utilization
    notes: Set the refresh interval and duration with `monitor-statistics interval <sec>` and `monitor-statistics duration <sec>`.
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Privileged_EXEC/monitor_ports_statistics_interface.shtml

  - cmd: monitor ports error <ports> main
    desc: Live-updating port error counters. Shows whether errors are still increasing right now.
    kind: show
    mode: Privileged EXEC
    tags: [errors, crc, live, monitor, troubleshooting]
    example: monitor ports error 1/12 main
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Privileged_EXEC/monitor_ports_error.shtml

  - cmd: show application iqagent status
    desc: The ExtremeCloud IQ agent status. Shows whether the switch is connected to ExtremeCloud IQ.
    kind: show
    mode: User EXEC
    tags: [xiq, extremecloud iq, iqagent, cloud, management, onboarding]
    notes: '`show application iqagent` shows the agent settings (server, proxy).'
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_application_iqagent_status.shtml

  - cmd: show khi cpp port-statistics [<ports>]
    desc: Which packet types and protocols each port sends to the CPU. The main tool to find the cause of a high CPU.
    kind: show
    mode: User EXEC
    tags: [cpu, control plane, khi, protocols, high cpu, arp, broadcast]
    example: show khi cpp port-statistics 1/1-1/48
    notes: A port with a huge ARP, broadcast or IGMP count is usually the source (loop, scanner, misbehaving host). On an MLT the counters increase equally on all members.
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_khi_cpp.shtml

  - cmd: trace level <module-id> <0-4> / trace screen enable / trace shutdown
    desc: Debug tracing of a software module (0 off to 4 verbose), shown on screen; trace shutdown stops all tracing.
    kind: action
    mode: User EXEC
    tags: [trace, debug, module, troubleshooting, tac]
    example: |
      trace level 14 3
      trace screen enable
      trace shutdown
    notes: >
      The module IDs differ per platform; use the CLI help (`trace level ?`). The official vIST troubleshooting
      procedure uses module 14 to watch ARP requests and replies, as in the example. Usually requested by Extreme GTAC.
    caution: Verbose tracing can load the CPU. Always end with `trace shutdown`.
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/trace_level.shtml
