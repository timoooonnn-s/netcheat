# Fields: see README.md -> "Adding and editing content". Keep `commands:` as the last key.
title: Edge Security and Storm Control
description: First-hop protection on access ports. DHCP snooping, Dynamic ARP Inspection, IP Source Guard, gateway spoof detection, and broadcast/multicast storm control.

commands:
  - cmd: show ip dhcp-snooping [vlan <vid>]
    desc: DHCP snooping state, globally and per VLAN.
    kind: show
    mode: User EXEC
    tags: [dhcp snooping, rogue dhcp, security, vlan]
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_ip_dhcp_snooping.shtml

  - cmd: show ip dhcp-snooping binding [vlan <vid>] [summary]
    desc: The binding table (client MAC, IP, VLAN, port, lease) that DAI and IP Source Guard rely on.
    kind: show
    mode: User EXEC
    tags: [dhcp snooping, binding, client, ip, mac, lease]
    notes: A client that has no binding is dropped by DAI and IP Source Guard. Typical causes are a static IP, or a lease obtained before snooping was enabled (the client has to renew).
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_ip_dhcp_snooping_binding.shtml

  - cmd: ip dhcp-snooping enable
    desc: Enable DHCP snooping globally (Global Config) or for a VLAN (VLAN Interface Config). Both are needed.
    kind: config
    mode: Global Config / VLAN Interface Config
    tags: [dhcp snooping, enable, rogue dhcp]
    example: |
      ip dhcp-snooping enable
      interface vlan 100
        ip dhcp-snooping enable
        ip arp-inspection enable
        exit
      interface gigabitEthernet 1/49
        ip dhcp-snooping trusted
        ip arp-inspection trusted
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Global_Configuration/ip_dhcp_snooping_enable.shtml

  - cmd: ip dhcp-snooping {trusted | untrusted}
    desc: The DHCP snooping trust of a port (default untrusted). Uplinks and ports toward DHCP servers must be trusted.
    kind: config
    mode: Interface Config
    tags: [dhcp snooping, trusted, uplink, port]
    caution: Untrusted uplinks drop the DHCP offers from the server, so clients get no address.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/GigabitEthernet_Interface_Configuration/ip_dhcp_snooping_for_port.shtml

  - cmd: ip arp-inspection enable
    desc: Dynamic ARP Inspection on a VLAN. ARPs whose IP/MAC do not match the DHCP snooping bindings are dropped on untrusted ports.
    kind: config
    mode: VLAN Interface Config
    tags: [dai, arp inspection, arp spoofing, security]
    notes: Needs DHCP snooping globally. Not possible on private VLANs (E-Tree), SPBM B-VLANs or MLT members. Mark uplinks with `ip arp-inspection trusted` on the port (default untrusted).
    caution: Clients with static IPs fail ARP unless you add static bindings (`ip dhcp-snooping binding`).
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/VLAN_Interface_Configuration/ip_arp_inspection_enable.shtml

  - cmd: show ip arp-inspection [vlan <vid>]
    desc: The DAI state per VLAN.
    kind: show
    mode: User EXEC
    tags: [dai, arp inspection, security]
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_ip_arp_inspection.shtml

  - cmd: ip source verify enable
    desc: IP Source Guard on a port. Only source IPs from the DHCP snooping bindings are accepted (max 10 per port).
    kind: config
    mode: Interface Config
    tags: [ipsg, ip source guard, spoofing, security]
    notes: >
      Requirements are DHCP snooping globally and on the VLAN, DAI on the same VLAN, and the port untrusted for both.
      Not possible on MLT/SMLT/LAG ports, brouter ports or private VLAN members. When the 10 addresses are used up, all
      further traffic from that port is dropped. Check the allowed addresses with `show ip source binding`.
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/GigabitEthernet_Interface_Configuration/ip_source_verify.shtml

  - cmd: show ip source binding [<ip>] [interface gigabitEthernet <ports>]
    desc: The IPv4 addresses that IP Source Guard allows per port.
    kind: show
    mode: User EXEC
    tags: [ipsg, ip source guard, binding]
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_ip_source_binding.shtml

  - cmd: spoof-detect port <ports> enable
    desc: Protect the gateway. If a host on the port sends ARPs claiming the switch's VLAN IP or VRRP virtual IP, its traffic is blocked.
    kind: config
    mode: Interface Config
    tags: [spoofing, gateway, duplicate ip, vrrp, security]
    notes: After a detection the switch sends a gratuitous ARP with the correct MAC. With SMLT, enable it on both peers. `auto-recover-port port <ports> enable` brings the port back automatically.
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/GigabitEthernet_Interface_Configuration/spoof_detect.shtml

  - cmd: rate-limit {broadcast | multicast | unknown-unicast} <pps>
    desc: Limit ingress broadcast, multicast or unknown-unicast traffic on a port (packets per second). Excess is dropped.
    kind: config
    mode: Interface Config
    tags: [rate limit, broadcast storm, multicast, storm control, flooding]
    example: |
      interface gigabitEthernet 1/1-1/48
        rate-limit broadcast 500
        rate-limit multicast 1000
    notes: Disabled by default. The official best practice is to rate-limit broadcast and multicast on access ports together with SLPP. Check the current limits with `show interfaces gigabitEthernet rate-limit`.
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/GigabitEthernet_Interface_Configuration/rate_limit.shtml

  - cmd: rate-limit action shutdown [<60-3600>] / rate-limit action threshold <drops>
    desc: Storm Control. Shut down (or trap) a port when the rate limit drops more than the threshold per polling interval.
    kind: config
    mode: Interface Config
    tags: [storm control, shutdown, rate limit, broadcast storm]
    since: "9.3"
    notes: Without a time the port stays down; with 60-3600 seconds it comes back on its own. Set the polling interval globally with `rate-limit poll-interval <3-300>` and check it with `show rate-limit`. Not on 7830 Series and 5320-16P-2MXT-2X.
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/GigabitEthernet_Interface_Configuration/rate-limit_action_shutdown.shtml
