# Fields: see README.md -> "Adding and editing commands". Keep `commands:` as the last key.
title: MLT, SMLT, vIST and LACP
description: Link aggregation (static MLT and LACP) and dual-homing with SMLT over a virtual IST (vIST) through the fabric.

commands:
  - cmd: show mlt [<mlt-id>]
    desc: All MLTs with type (normal/SMLT), member ports, active ports and VLANs.
    kind: show
    mode: User EXEC
    tags: [mlt, lag, port-channel, members, smlt]
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_mlt.shtml

  - cmd: show smlt mlt
    desc: SMLT state per MLT, local and remote (peer) status.
    kind: show
    mode: User EXEC
    tags: [smlt, mlt, dual-homing, vist, state]
    notes: An SMLT whose peer side shows down only works single-homed. Check the vIST and the MLT on the peer.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_smlt.shtml

  - cmd: show virtual-ist
    desc: vIST state, peer IP, vIST VLAN and whether the peer is up. The first check for any SMLT problem.
    kind: show
    mode: User EXEC
    tags: [vist, ist, smlt, peer, cluster]
    notes: >
      The vIST runs through the fabric, so it is up as long as there is SPBM connectivity between the peers.
      If it is down, check IS-IS between the peers, the vIST VLAN I-SID (must be the same on both peers and
      unique in the fabric), the IP subnet and the ARP to the peer IP.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_virtual_ist.shtml

  - cmd: show virtual-ist stat
    desc: vIST message counters (hellos sent/received, IST down events).
    kind: show
    mode: User EXEC
    tags: [vist, statistics, hello, smlt]
    notes: Clear them with `clear virtual-ist stats` and check whether hellos still arrive.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_virtual_ist_stat.shtml

  - cmd: show mlt stats [<mlt-id>] / show mlt error main [<mlt-id>]
    desc: Traffic and error counters per MLT.
    kind: show
    mode: User EXEC
    tags: [mlt, statistics, errors, counters]
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_mlt_stats.shtml

  - cmd: monitor mlt stats interface utilization [<mlt-id>]
    desc: Live MLT utilization. Shows whether the load is shared across the links.
    kind: show
    mode: Privileged EXEC
    tags: [mlt, utilization, load sharing, hashing, live]
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Privileged_EXEC/monitor_mlt_stats_interface_utilization.shtml

  - cmd: show lacp interface [gigabitethernet <ports> | mlt]
    desc: LACP state per port (actor/partner, key, aggregation, synchronization).
    kind: show
    mode: User EXEC
    tags: [lacp, lag, partner, actor, key, 802.3ad]
    notes: '`show lacp actor-oper interface` and `show lacp partner-oper interface` show both sides in detail. A port that does not aggregate usually has a key mismatch or a partner without LACP.'
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/User_EXEC/show_lacp_interface.shtml

  - cmd: show interfaces gigabitEthernet statistics lacp [<ports>]
    desc: LACPDU counters per port (sent/received, errors).
    kind: show
    mode: Privileged EXEC
    tags: [lacp, lacpdu, counters]
    notes: If the received count stays at 0, the partner sends no LACP.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Privileged_EXEC/show_interfaces_gigabitethernet_statistics_lacp.shtml

  - cmd: mlt <id> enable name "<name>" / mlt <id> member <ports>
    desc: Create a static MLT (LAG) and add member ports.
    kind: config
    mode: Global Config
    tags: [mlt, lag, create, static, members]
    example: |
      mlt 10 enable name "SRV-ESX01"
      mlt 10 member 1/10,2/10
      mlt 10 encapsulation dot1q
      vlan mlt 100 10
    notes: MLT names cannot be only digits. For SMLT, configure the same MLT ID on both vIST peers.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Global_Configuration/mlt.shtml

  - cmd: lacp enable key <key> (interface mlt)
    desc: Make an MLT dynamic (LACP). Its key must match the key of the member ports.
    kind: config
    mode: MLT Interface Config
    tags: [lacp, mlt, key, dynamic, 802.3ad]
    example: |
      mlt 20 enable name "SW-ACCESS-12"
      interface mlt 20
        lacp enable key 20
        exit
      interface gigabitEthernet 1/20,2/20
        lacp key 20
        lacp aggregation enable
        lacp timeout-time short
        lacp enable
    notes: >
      The recipe: port key, port aggregation enable, port lacp enable, then an MLT with the same key.
      Enable LACP globally too (`lacp enable` in Global Config). Once LACP is enabled you cannot add or
      remove ports by hand. VLANs added to an LACP MLT only reach the active ports, so add the VLAN to the
      inactive members as well.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/MLT_Interface_Configuration/lacp_on_an_mlt.shtml

  - cmd: lacp key <key> / lacp aggregation enable / lacp enable (interface)
    desc: Port-side LACP settings. Key (must match the MLT), aggregatable, LACP on.
    kind: config
    mode: Interface Config
    tags: [lacp, port, key, aggregation]
    notes: Further options are `lacp mode active|passive` and `lacp timeout-time short|long`. The timeout must match the partner.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/GigabitEthernet_Interface_Configuration/lacp_key.shtml

  - cmd: lacp smlt-sys-id <mac>
    desc: Global LACP system ID for SMLT. Both vIST peers must present the same LACP system ID to the partner.
    kind: config
    mode: Global Config
    tags: [lacp, smlt, system id, vist, dual-homing]
    notes: Without a common system ID, the downstream device sees two different partners and only bundles the links to one peer.
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Global_Configuration/lacp_globally.shtml

  - cmd: spbm 1 smlt-peer-system-id <peer-system-id>
    desc: Tell the SPBM instance who the vIST peer is. Required for SMLT.
    kind: config
    mode: IS-IS Router Config
    tags: [smlt, vist, peer, system-id, spbm]
    example: |
      no router isis enable
      router isis
        spbm 1 smlt-peer-system-id 0200.0001.0102
        spbm 1 smlt-virtual-bmac 02:00:00:01:01:ff
        exit
      router isis enable
    notes: >
      IS-IS must be disabled for this. If you use manual system-ids, also set the virtual B-MAC
      (`spbm 1 smlt-virtual-bmac`), the same on both peers. With default system-ids it is derived
      (lower system-id + 0x01). The peer with the lower system-id becomes the primary split-BEB.
    caution: Disabling IS-IS takes the switch out of the fabric for the duration of the change.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/IS-IS_Router_Configuration/spbm_1_100_smlt_peer_system_id.shtml

  - cmd: virtual-ist peer-ip <peer-ip> vlan <vist-vlan>
    desc: Create the vIST to the peer, over a VLAN with an I-SID and an IP subnet.
    kind: config
    mode: Global Config
    tags: [vist, ist, smlt, peer, create]
    example: |
      vlan create 4000 name "VIST" type port-mstprstp 0
      vlan i-sid 4000 15999000
      interface vlan 4000
        ip address 10.255.255.1 255.255.255.252
        exit
      virtual-ist peer-ip 10.255.255.2 vlan 4000
    notes: The vIST VLAN needs an I-SID that is used nowhere else in the fabric, and a subnet shared only by the two peers. The vIST needs both the smlt-peer-system-id and the peer-ip.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Global_Configuration/virtual_ist.shtml

  - cmd: smlt (interface mlt)
    desc: Make an MLT an SMLT (dual-homed across both vIST peers).
    kind: config
    mode: MLT Interface Config
    tags: [smlt, mlt, dual-homing, vist]
    example: |
      interface mlt 10
        smlt
        exit
    notes: Every VLAN on an SMLT must have an I-SID, and the same VLAN/I-SID must exist on the peer, even if nothing is connected there.
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20User%20Guide/fe_9.4_ug_revacdev/content/documents/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_user_guide/virtual_interswitch_trunk_vist.shtml

  - cmd: clear mac-address-table remote
    desc: Remove MAC entries that both vIST peers mark as "remote", which can be left over after a vIST incident.
    kind: clear
    mode: Privileged EXEC
    tags: [mac, vist, remote, smlt, stale, fdb]
    rare: true
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Privileged_EXEC/clear_mac_address_table_remote.shtml

  - cmd: sys control virtual-ist mac-move-protection
    desc: MAC move protection on the vIST, which limits MAC flapping between the peers.
    kind: config
    mode: Global Config
    tags: [vist, mac move, flapping, protection]
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Global_Configuration/sys_control_virtual_ist.shtml

  - cmd: clear lacp stats [port <ports>]
    desc: Reset the LACP counters.
    kind: clear
    mode: Privileged EXEC
    tags: [lacp, counters, clear]
    ref: https://documentation.extremenetworks.com/Fabric%20Engine%20v9.4%20Command%20References/Switch_Operating_Systems/VOSS_and_Fabric_Engine/fabric_engine_cli_commands_reference/Privileged_EXEC/clear_lacp.shtml
